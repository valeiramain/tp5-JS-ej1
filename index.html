<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo practico de DOM Y BOM">
    <meta name="keywords" content="DOM, BOM, POO, javascript">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Ejercicio 1</title>
</head>

<body>
    <main>
        <form class="container form-magico my-5 text-center p-3">
            <div class="mb-4">
                <label for="nroMagico" class="form-label display-4 fw-bold text-primary-emphasis">Ingrese un número:</label>
                <input type="number" class="form-control w-md-25 mx-auto fs-4" id="nroMagico"
                    placeholder="Número Mágico">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-warning fs-4 primary-emphasis">Comenzar</button>
            </div>
        </form>
        <section class="container text-center">
            <div class="p-3 mb-2 bg-info-subtle text-info-emphasis">👆El número mágico es más grande</div>
            <div class="p-3 mb-2 bg-danger-subtle text-danger-emphasis">👇El número mágico es más chico</div>
            <div class="p-3 mb-2 bg-success-subtle text-success-emphasis">👏Felicitaciones! Encontraste el número
                mágico.</div>
        </section>
    </main>
    <footer class="text-center py-3 bg-body-tertiary">
        <p>&copy; Todos los derechos reservados 2025</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
